services:
  postgres:
    image: postgres:15-alpine
    container_name: domain_registration_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: DomainRegistrationLiveDashboardDB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: domain_registration_redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  splitter:
    build: ./SplitterService
    container_name: domain_registration_splitter
    expose:
      - "8000"
    environment:
      PORT: 8000
    restart: unless-stopped

  certstream:
    # Open-source, self-hosted CertStream server
    image: 0rickyy0/certstream-server-go
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./DomainRegistrationLiveBackend
    container_name: domain_registration_backend

    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=Asia/Kolkata
        -Dspring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
        -Dspring.jpa.properties.hibernate.jdbc.batch_size=100
        -Dspring.jpa.properties.hibernate.order_inserts=true
        -Dspring.jpa.properties.hibernate.order_updates=true
      DB_URL: jdbc:postgresql://postgres:5432/DomainRegistrationLiveDashboardDB
      DB_USER: postgres
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPLITTER_URL: http://splitter:8000

      COLLECTOR_CERTSTREAM_URL: ws://certstream:8080/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      splitter:
        condition: service_started
      certstream:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./DomainRegistrationLiveFrontend
      args:

        NEXT_PUBLIC_API_URL:

        BACKEND_URL: http://backend:8080
    container_name: domain_registration_frontend

    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
