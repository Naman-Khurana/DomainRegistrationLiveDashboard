version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: domain_registration_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: naman1234
      POSTGRES_DB: DomainRegistrationLiveDashboardDB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: domain_registration_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  splitter:
    build: ./SplitterService
    container_name: domain_registration_splitter
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  backend:
    build: ./DomainRegistrationLiveBackend
    container_name: domain_registration_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/DomainRegistrationLiveDashboardDB
      - DB_USER=postgres
      - DB_PASS=naman1234
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPLITTER_URL=http://splitter:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      splitter:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./DomainRegistrationLiveFrontend
    container_name: domain_registration_frontend
    ports:
      - "3000:3000"
    environment:
      # Use this if you need SSR/API proxying to talk to the backend container internally:
      - BACKEND_URL=http://backend:8080
      # Any client-side requests still need to hit localhost:8080 (or your public IP).
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
