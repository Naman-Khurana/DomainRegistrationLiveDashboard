services:
  postgres:
    image: postgres:15-alpine
    container_name: domain_registration_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: DomainRegistrationLiveDashboardDB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: domain_registration_redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  splitter:
    build: ./SplitterService
    container_name: domain_registration_splitter
    expose:
      - "8000"
    environment:
      PORT: 8000
    restart: unless-stopped

  backend:
    build: ./DomainRegistrationLiveBackend
    container_name: domain_registration_backend
    # Bind only to localhost — Caddy proxies from the outside.
    # The backend is NOT directly reachable from the internet.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/DomainRegistrationLiveDashboardDB
      DB_USER: postgres
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPLITTER_URL: http://splitter:8000
      # Single-domain deployment: frontend and backend share the same origin.
      # CORS is only needed for local dev (localhost:3000 vs localhost:8080).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      splitter:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./DomainRegistrationLiveFrontend
      args:
        # In single-domain Caddy mode NEXT_PUBLIC_API_URL is left empty.
        # The browser uses relative URLs (/v1/...) which Caddy routes to the backend.
        # The Next.js server-side rewrite proxy is not used in this mode.
        NEXT_PUBLIC_API_URL: # BACKEND_URL is used by next.config.ts rewrites for local dev only.

        BACKEND_URL: http://backend:8080
    container_name: domain_registration_frontend
    # Bind only to localhost — Caddy proxies from the outside.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
